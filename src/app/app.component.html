
<main class="dashboard">
  <header class="dashboard-header">
    <p class="subtitle">My Writing Space</p>
    <h1>{{ title }}</h1>
    <p>Manage your profile, availability, and author bio.</p>
  </header>

  <!-- Pass the user object into the profile card. -->
   <app-user-card [user]="user"></app-user-card>

   <div class="dashboard-controls">
    <!-- Listen for the child's status toggle event. -->
     <app-user-status
      [isOnline]="user.isOnline"
      (statusToggled)="toggleStatus()">
     </app-user-status>

     <!-- Receive the new bio through the child's output event. -->
      <app-user-bio
        [bio]="user.bio"
        (bioSaved)="updateBio($event)">
      </app-user-bio>
   </div>

   <!-- Announce feedback when a profile change is made. -->
    <p class="feedback" role="status">{{ message }}</p>

</main>
